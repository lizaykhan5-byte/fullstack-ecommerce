<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - EliteStore</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/checkout.css" />
</head>
<body>

  <div id="navbar"></div>

  <main class="checkout-page">

    <div class="checkout-head">
      <p>Home / Checkout</p>
      <h1>Checkout</h1>
    </div>

    <div class="checkout-layout">

      <section class="checkout-form">
        <h3>Shipping Details</h3>

        <form onsubmit="placeOrder(event)">
          <div class="form-grid">
            <div class="input-group">
              <label>Full Name</label>
              <input type="text" id="fullName" required>
            </div>

            <div class="input-group">
              <label>Phone Number</label>
              <input type="text" id="phone" required>
            </div>
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" required>
          </div>

          <div class="input-group">
            <label>Address</label>
            <textarea id="address" rows="4" required></textarea>
          </div>

          <div class="form-grid">
            <div class="input-group">
              <label>City</label>
              <input type="text" id="city" required>
            </div>

            <div class="input-group">
              <label>Payment Method</label>
              <select id="payment" required>
                <option value="">Select method</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Card Payment">Card Payment</option>
              </select>
            </div>
          </div>

          <button type="submit" class="place-btn">Place Order</button>
        </form>
      </section>

      <aside class="checkout-summary">
        <h3>Order Summary</h3>

        <div id="checkoutItems"></div>

        <div class="summary-line">
          <span>Subtotal</span>
          <strong id="checkoutSubtotal">Rs. 0</strong>
        </div>

        <div class="summary-line">
          <span>Shipping</span>
          <strong>Rs. 250</strong>
        </div>

        <div class="summary-line total">
          <span>Total</span>
          <strong id="checkoutTotal">Rs. 0</strong>
        </div>
      </aside>

    </div>

  </main>
<div id="toast"></div>
  <script src="js/checkoutNavbar.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
