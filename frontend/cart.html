<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - EliteStore</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cart.css" />
</head>
<body>

  <div id="navbar"></div>

  <main class="cart-page">

    <div class="cart-head">
      <div>
        <p>Home / Cart</p>
        <h1>Shopping Cart</h1>
      </div>
      <a href="products.html">Continue Shopping</a>
    </div>

    <div class="cart-layout">

      <section class="cart-items" id="cartItems">
        <!-- Cart items will show here -->
      </section>

      <aside class="summary">
        <h3>Order Summary</h3>

        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="subtotal">Rs. 0</strong>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <strong>Rs. 250</strong>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <strong id="total">Rs. 0</strong>
        </div>

        <button onclick="goCheckout()">Checkout</button>
      </aside>

    </div>

  </main>
<div id="toast"></div>
  <script src="js/navbar.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
