<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - EliteStore</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div id="navbar"></div>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-left">
        <h1>Welcome back</h1>
        <p>Login to manage your orders, cart and saved products.</p>
      </div>

      <div class="auth-form">
        <h2>Login</h2>
        <p class="form-text">Enter your account details</p>

        <form onsubmit="loginUser(event)">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="example@email.com" required>
          </div>

          <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password" required>
          </div>

          <div class="form-row">
            <label>
              <input type="checkbox"> Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="switch-page">
          Don’t have an account?
          <a href="register.html">Create account</a>
        </p>
      </div>

    </section>

  </main>
<div id="toast"></div>
 <script src="js/authNavbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
