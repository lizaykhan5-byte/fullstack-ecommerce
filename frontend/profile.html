<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | EliteStore</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<div id="navbar"></div>

<section class="profile-page">

    <div class="profile-card">

        <div class="profile-avatar">
            👤
        </div>

        <h2 id="userName">Loading...</h2>

        <p id="userEmail"></p>

        <span class="user-role">
            Customer
        </span>

    </div>

    <div class="profile-actions">

        <a href="orders.html" class="profile-box">
            📦
            <h3>My Orders</h3>
            <p>View your previous orders</p>
        </a>

        <a href="wishlist.html" class="profile-box">
            ❤️
            <h3>Wishlist</h3>
            <p>Your favorite products</p>
        </a>

        <a href="cart.html" class="profile-box">
            🛒
            <h3>Shopping Cart</h3>
            <p>View items in cart</p>
        </a>

        <div class="profile-box logout-box" onclick="logout()">
            🚪
            <h3>Logout</h3>
            <p>Sign out of your account</p>
        </div>

    </div>

</section>

<div id="toast"></div>

<script src="js/navbar.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
