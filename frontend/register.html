<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - EliteStore</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div id="navbar"></div>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-left">
        <h1>Create account</h1>
        <p>Join EliteStore to shop faster, track orders and save your favorite products.</p>
      </div>

      <div class="auth-form">
        <h2>Register</h2>
        <p class="form-text">Create your new account</p>

        <form onsubmit="registerUser(event)">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="registerName" placeholder="Enter your name" required>
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="registerEmail" placeholder="example@email.com" required>
          </div>
<div class="input-group">
  <label>Password</label>
  <input 
    type="password" 
    id="registerPassword" 
    placeholder="Create password" 
    required 
    oninput="checkPasswordStrength()"
  >

  <div class="password-strength">
    <div id="strengthBar"></div>
  </div>

  <p id="strengthText"></p>
</div>
         

          <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <p class="switch-page">
          Already have an account?
          <a href="login.html">Login</a>
        </p>
      </div>

    </section>

  </main>
<div id="toast"></div>
  <script src="js/authNavbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
